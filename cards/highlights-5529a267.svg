<svg xmlns="http://www.w3.org/2000/svg" width="840" height="340" viewBox="0 0 840 340" role="img" aria-labelledby="ht hd">
  <title id="ht">Highlights</title>
  <desc id="hd">200K+ users on the platform (Astorie); 1.8M+ AI generations run (Astorie); 150+ businesses on the platform (AdsGency AI); $50M+ ad spend managed (AdsGency AI); 1.6M+ lines of code this year (Astorie + AdsGency AI); 100+ features shipped (Astorie + AdsGency AI); 12.7K contributions in 12 months (all GitHub accounts); 2,005 PRs merged (Astorie + AdsGency AI).</desc>
  <style>
    :root { --bg:#ffffff; --border:#d0d7de; --ink:#1f2328; --ink2:#59636e; --muted:#818b98; --grid:#eaeef2; --k0:#2f6fde; --k1:#c2477f; --k2:#1fa3a3; --k3:#7a5af5; --card:#f6f8fa; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0d1117; --border:#30363d; --ink:#e6edf3; --ink2:#9198a1; --muted:#6e7681; --grid:#21262d; --k0:#4c8df6; --k1:#d0578f; --k2:#22a5a5; --k3:#8a6ff0; --card:#161b22; }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .bg { fill: var(--bg); stroke: var(--border); }
    .h { fill: var(--ink); font-size: 16px; font-weight: 600; }
    .num { fill: var(--ink); font-size: 22px; font-weight: 600; }
    .lbl { fill: var(--ink2); font-size: 12px; }
    .ax { fill: var(--muted); font-size: 11px; }
    .card { fill: var(--card); stroke: var(--border); }
    .big { fill: var(--ink); font-size: 30px; font-weight: 700; }
    .k0 { fill: var(--k0); } .k1 { fill: var(--k1); } .k2 { fill: var(--k2); } .k3 { fill: var(--k3); }
    .tile { animation: up .6s cubic-bezier(.2,.8,.3,1) both; }
    @keyframes up { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .tile { animation: none; } }
  </style>
  <text class="h" x="24" y="34">Scale of what I build on</text><g class="tile" style="animation-delay:0.10s"><rect class="card" x="24" y="48" width="188" height="118" rx="10"/><rect class="k0" x="24" y="48" width="4" height="118" rx="2"/><text class="big" x="44" y="98">200K+</text><text class="lbl" x="44" y="124">users on the platform</text><text class="ax" x="44" y="146">Astorie</text></g><g class="tile" style="animation-delay:0.20s"><rect class="card" x="228" y="48" width="188" height="118" rx="10"/><rect class="k1" x="228" y="48" width="4" height="118" rx="2"/><text class="big" x="248" y="98">1.8M+</text><text class="lbl" x="248" y="124">AI generations run</text><text class="ax" x="248" y="146">Astorie</text></g><g class="tile" style="animation-delay:0.30s"><rect class="card" x="432" y="48" width="188" height="118" rx="10"/><rect class="k2" x="432" y="48" width="4" height="118" rx="2"/><text class="big" x="452" y="98">150+</text><text class="lbl" x="452" y="124">businesses on the platform</text><text class="ax" x="452" y="146">AdsGency AI</text></g><g class="tile" style="animation-delay:0.40s"><rect class="card" x="636" y="48" width="188" height="118" rx="10"/><rect class="k3" x="636" y="48" width="4" height="118" rx="2"/><text class="big" x="656" y="98">$50M+</text><text class="lbl" x="656" y="124">ad spend managed</text><text class="ax" x="656" y="146">AdsGency AI</text></g><text class="h" x="24" y="192">What I ship</text><g class="tile" style="animation-delay:0.50s"><rect class="card" x="24" y="206" width="188" height="118" rx="10"/><rect class="k0" x="24" y="206" width="4" height="118" rx="2"/><text class="big" x="44" y="256">1.6M+</text><text class="lbl" x="44" y="282">lines of code this year</text><text class="ax" x="44" y="304">Astorie + AdsGency AI</text></g><g class="tile" style="animation-delay:0.60s"><rect class="card" x="228" y="206" width="188" height="118" rx="10"/><rect class="k1" x="228" y="206" width="4" height="118" rx="2"/><text class="big" x="248" y="256">100+</text><text class="lbl" x="248" y="282">features shipped</text><text class="ax" x="248" y="304">Astorie + AdsGency AI</text></g><g class="tile" style="animation-delay:0.70s"><rect class="card" x="432" y="206" width="188" height="118" rx="10"/><rect class="k2" x="432" y="206" width="4" height="118" rx="2"/><text class="big" x="452" y="256">12.7K</text><text class="lbl" x="452" y="282">contributions in 12 months</text><text class="ax" x="452" y="304">all GitHub accounts</text></g><g class="tile" style="animation-delay:0.80s"><rect class="card" x="636" y="206" width="188" height="118" rx="10"/><rect class="k3" x="636" y="206" width="4" height="118" rx="2"/><text class="big" x="656" y="256">2,005</text><text class="lbl" x="656" y="282">PRs merged</text><text class="ax" x="656" y="304">Astorie + AdsGency AI</text></g>
</svg>
