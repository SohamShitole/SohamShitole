<svg xmlns="http://www.w3.org/2000/svg" width="840" height="270" viewBox="0 0 840 270" role="img" aria-labelledby="kt kd">
  <title id="kt">What I write and what I build with</title>
  <desc id="kd">Lines added at Astorie by language: TypeScript 78%, React (TSX) 13%, SQL 6%, Shell 1%, Other 1%. Stack: TypeScript, React, Next.js, Postgres, Supabase, Drizzle, Zustand, React Flow, Vercel AI SDK, OpenAI, Anthropic, FAL, Stripe, PostHog, Railway, Vercel.</desc>
  <style>
    :root { --bg:#ffffff; --border:#d0d7de; --ink:#1f2328; --ink2:#59636e; --muted:#818b98; --grid:#eaeef2; --ts:#2f6fde; --tsx:#1fa3a3; --sql:#d9822b; --sh:#7a5af5; --oth:#8c959f; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0d1117; --border:#30363d; --ink:#e6edf3; --ink2:#9198a1; --muted:#6e7681; --grid:#21262d; --ts:#4c8df6; --tsx:#22a5a5; --sql:#cf7f33; --sh:#8a6ff0; --oth:#6e7681; }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .bg { fill: var(--bg); stroke: var(--border); }
    .h { fill: var(--ink); font-size: 16px; font-weight: 600; }
    .num { fill: var(--ink); font-size: 22px; font-weight: 600; }
    .lbl { fill: var(--ink2); font-size: 12px; }
    .ax { fill: var(--muted); font-size: 11px; }
    .v { fill: var(--ink); font-size: 12px; font-weight: 600; }
    .arc { fill: none; stroke-width: 22; transform: rotate(-90deg); transform-origin: 130px 135px; opacity: 0; animation: in .5s ease-out forwards; }
    .ts { stroke: var(--ts); } .tsx { stroke: var(--tsx); } .sql { stroke: var(--sql); } .sh { stroke: var(--sh); } .oth { stroke: var(--oth); }
    .tsf { fill: var(--ts); } .tsxf { fill: var(--tsx); } .sqlf { fill: var(--sql); } .shf { fill: var(--sh); } .othf { fill: var(--oth); }
    .pill { fill: var(--bg); stroke: var(--border); }
    .pt { fill: var(--ink2); font-size: 11.5px; }
    @keyframes in { to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .arc { animation: none; opacity: 1; } }
  </style>
